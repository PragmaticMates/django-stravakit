[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-stravakit"
version = "0.6.2"
description = "Reusable Django app for Strava API integration"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "PragmaticMates" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=5.1",
    # 2.0 is the first release whose Client accepts refresh_token/token_expires and
    # auto-refreshes an expired token — the per-athlete token layer depends on it.
    "stravalib>=2.0",
    "django-unfold",
    "django-htmx",
]

[project.urls]
Homepage = "https://github.com/PragmaticMates/django-stravakit"
Repository = "https://github.com/PragmaticMates/django-stravakit"
Issues = "https://github.com/PragmaticMates/django-stravakit/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-django"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["stravakit*"]

[tool.setuptools.package-data]
stravakit = [
    "templates/**/*",
    "static/**/*",
]
